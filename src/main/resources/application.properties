spring.application.name=course-service

server.port=${SERVER_PORT:8082}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/course_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:new_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

springdoc.swagger-ui.operationsSorter=method
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8090/realms/ai-learning-platform}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8090/realms/ai-learning-platform/protocol/openid-connect/certs}

# Enable public access to course APIs for UIs without Keycloak login
app.security.open-course-api=true

# CORS Configuration
server.servlet.cors.allowed-origins=http://localhost:5173,http://localhost:5174,http://localhost:5175
server.servlet.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
server.servlet.cors.allowed-headers=*
server.servlet.cors.allow-credentials=false