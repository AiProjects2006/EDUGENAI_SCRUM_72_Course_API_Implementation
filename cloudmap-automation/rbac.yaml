apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cloudmap-updater
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cloudmap-updater
  namespace: default
subjects:
  - kind: ServiceAccount
    name: cloudmap-updater
    namespace: default
roleRef:
  kind: Role
  name: cloudmap-updater
  apiGroup: rbac.authorization.k8s.io
