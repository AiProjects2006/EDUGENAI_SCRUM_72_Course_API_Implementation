apiVersion: v1
kind: Service
metadata:
  name: keycloak
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
spec:
  selector:
    app: keycloak

  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP

  type: LoadBalancer